name: Windows build

# Builds the signed-capable Squirrel installer on a Windows runner, so no local
# Windows machine is needed. Trigger it from the Actions tab; the installer is
# attached as a downloadable artifact.
#
# Signing is opt-in: add the repository secrets
#   WINDOWS_CERT_BASE64   base64 of the .pfx code-signing certificate
#   WINDOWS_CERT_PASSWORD the .pfx password
# and the build starts producing signed installers without further changes.

on:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Node runtime for Windows
        run: npm run check:node:win

      - name: Prepare signing certificate (optional)
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_BASE64) {
            Write-Host "No WINDOWS_CERT_BASE64 secret configured; building an unsigned installer."
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'mareo-codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERT_FILE=$path"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERT_PASSWORD=$env:CERT_PASSWORD"
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$path"
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=$env:CERT_PASSWORD"
          Write-Host "Signing certificate prepared."

      - name: Build installer
        run: npm run make:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MareoSetup-windows-x64
          path: out/make/squirrel.windows/x64/MareoSetup.exe
          if-no-files-found: error
          retention-days: 30
